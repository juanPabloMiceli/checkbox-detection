<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <img
        src="/checkbox-logo.svg"
        class="brand-logo"
        alt="" aria-hidden="true"
      />
      <span class="brand-name">Checkbox Detection</span>
    </div>

    <span class="header-subtitle">
      Document workspace
    </span>
  </header>

  <main class="workspace">
    <section class="documents-panel">
      <div class="documents-header">
        <h2>Documents</h2>
        <span class="documents-count">
          {{ workspace.documents().length }} files
        </span>
      </div>
      <app-upload-area (filesAdded)="addFiles($event)" />

      <app-uploaded-document-list
        [documents]="workspace.documents()"
        [selectedDocumentId]="workspace.selectedDocumentId()"
        (documentSelected)="workspace.selectDocument($event)"
        (documentProcessed)="workspace.processDocument($event)"
        (documentRemoved)="workspace.removeDocument($event)"
        (processAll)="workspace.processAll()"
      />

    </section>

    <section class="viewer-panel">
      @if (workspace.selectedDocument(); as document) {
        <app-document-viewer
          [imageUrl]="document.imageUrl"
          [detections]="document.detections"
          [status]="document.status"
        />
      } @else {
        <div class="empty-viewer">
          <p>Select a document to preview it.</p>
        </div>
      }
    </section>
  </main>
  @if (toast(); as message) {
    <div class="toast" role="alert">
      <div class="toast-content">
        <strong>{{ message.title }}</strong>
        <p>{{ message.description }}</p>
      </div>

      <button
        type="button"
        class="toast-close"
        aria-label="Dismiss notification"
        (click)="toast.set(null)"
      >
        ✕
      </button>
    </div>
  }
</div>
