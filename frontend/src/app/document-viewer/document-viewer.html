@if (status() === 'completed') {
  <div class="detection-stats">
    <div class="stat-item">
      <span class="stat-label">Detected</span>
      <span class="stat-value">{{ totalDetections() }}</span>
    </div>

    <div class="stat-item stat-item--checked">
      <span class="stat-label">Checked</span>
      <span class="stat-value">{{ totalCheckedDetections() }}</span>
    </div>

    <div class="stat-item stat-item--unchecked">
      <span class="stat-label">Unchecked</span>
      <span class="stat-value">{{ totalUncheckedDetections() }}</span>
    </div>
  </div>
} @else {
  <h2>Document preview</h2>
}
<app-image-viewport
  #viewport
  [imageUrl]="imageUrl()"
  [detections]="detections()"
  [status]="status()"
  [selectedDetectionIndex]="selectedDetectionIndex()"
  [showBoundingBoxes]="showBoundingBoxes()"
  (detectionSelected)="selectDetection($event)"
  (selectionCleared)="clearSelection()"
  (annotationsToggled)="toggleBoundingBoxes()"
>
  @if (status() === 'completed') {
    <app-detection-results
      [detections]="detections()"
      [selectedDetectionIndex]="selectedDetectionIndex()"
      [showBoundingBoxes]="showBoundingBoxes()"
      [zoom]="viewport.zoom()"
      (detectionSelected)="selectDetection($event)"
      (previousRequested)="previousDetection()"
      (nextRequested)="nextDetection()"
    />
  }
</app-image-viewport>
