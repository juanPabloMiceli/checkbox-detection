<div class="viewer-toolbar">
  <div class="zoom-controls">
    <button
      type="button"
      (click)="zoomOut()"
      [disabled]="zoom() <= minZoom"
      aria-label="Zoom out"
    >
      −
    </button>

    <span class="zoom-value">
      {{ zoomPercentage() }}%
    </span>

    <button
      type="button"
      (click)="zoomIn()"
      [disabled]="zoom() >= maxZoom"
      aria-label="Zoom in"
    >
      +
    </button>

    <button
      type="button"
      (click)="resetZoom()"
      title="Fit image to viewer"
    >
      Fit
    </button>
  </div>
  @if (status() === 'completed') {
    <button
      type="button"
      (click)="annotationsToggled.emit()"
      [attr.aria-pressed]="showBoundingBoxes()"
    >
      {{ showBoundingBoxes() ? 'Hide annotations' : 'Show annotations' }}
    </button>
  }
</div>
<div class="results-layout" [class.preview-only]="status() !== 'completed'">
<div class="document-canvas">
  <div
    class="image-stage"
    #imageStage
    (wheel)="onImageWheel($event)"
  >
    <div class="image-scroll-content">
      <div
        class="image-wrapper"
        #imageWrapper
        [style.width.px]="displayWidth()"
        [style.height.px]="displayHeight()"
      >
        <img
          [src]="imageUrl()"
          alt="Document preview"
          (load)="onImageLoad($event)"
        />

        @if (
          status() === 'completed' &&
          showBoundingBoxes() &&
          imageWidth() > 0 &&
          imageHeight() > 0
        ) {
          <svg
            class="checkbox-overlay"
            [attr.viewBox]="'0 0 ' + imageWidth() + ' ' + imageHeight()"
            preserveAspectRatio="none"
            (click)="selectionCleared.emit()"
          >
            @for (detection of detections(); track $index) {
              <rect
                [attr.x]="detection.bbox[0]"
                [attr.y]="detection.bbox[1]"
                [attr.width]="detection.bbox[2] - detection.bbox[0]"
                [attr.height]="detection.bbox[3] - detection.bbox[1]"
                fill-opacity="0.2"
                [attr.stroke]="detection.is_checked ? '#16a34a' : '#ef4444'"
                [attr.stroke-width]="selectedDetectionIndex() === $index ? 8 : 4"
                [attr.fill]="selectedDetectionIndex() === $index
                  ? (detection.is_checked ? '#16a34a' : '#ef4444')
                  : 'none'"
                (click)="detectionSelected.emit($index); $event.stopPropagation()"
              />
            }
          </svg>
        }
      </div>
    </div>
  </div>
</div>

  <ng-content />
</div>
